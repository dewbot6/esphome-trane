substitutions:
  version: "dev"

esphome:
  name: esphome-trane
  friendly_name: ESPHome Trane
  project:
    name: "andrewsnodgrass.trane-hvac"
    version: ${version}

  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: |-
          // Restore last known mode immediately so climate entity isn't stuck at OFF
          if (!id(last_mode).empty())
            id(system_mode).publish_state(id(last_mode));
          // Also request current state from SC360
          id(can_transmit_json).execute(std::string("{\"GetProfile\":\"SYSOP\"}"));

  devices:
    - id: dev_thermostat
      name: "Trane Thermostat UX360"
    - id: dev_sc360
      name: "Trane SC360 Controller"
    - id: dev_air_handler
      name: "Trane Air Handler"
    - id: dev_heat_pump
      name: "Trane Heat Pump"

external_components:
  - source:
      type: local
      path: components
    components: [trane_hvac]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    sensor: WARN
    canbus: WARN
    can649: DEBUG
    can641: DEBUG
    can490: DEBUG
    can386: DEBUG
    can5c9: DEBUG
    can5c1: DEBUG

api:
  services:
    - service: set_temperature
      variables:
        target_temp_low: float
        target_temp_high: float
      then:
        - script.execute:
            id: can_transmit_json
            payload: !lambda |-
              char buf[128];
              snprintf(buf, sizeof(buf),
                "{\"SpOverride\":{\"Put\":{\"1\":{\"Hsp\":\"%.0f\",\"Csp\":\"%.0f\",\"HoldType\":\"2\",\"Source\":\"1\"}}}}",
                target_temp_low, target_temp_high);
              return std::string(buf);

    - service: set_mode
      variables:
        mode: string
      then:
        - script.execute:
            id: can_transmit_json
            payload: !lambda |-
              std::string m = "C";
              if (mode == "heat") m = "A";
              else if (mode == "cool") m = "B";
              char buf[64];
              snprintf(buf, sizeof(buf),
                "{\"SystemMode\":{\"Put\":{\"B\":\"%s\"}}}",
                m.c_str());
              return std::string(buf);

ota:
  - platform: esphome

web_server:
  port: 80

improv_serial:

captive_portal:

wifi:
  networks:
